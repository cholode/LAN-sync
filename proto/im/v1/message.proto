syntax = "proto3";

package lan_im.im.v1;

option go_package = "lan-im-go/proto/im/v1;imv1";

message ChatMessage {
  int64 room_id = 1;
  int64 sender_id = 2;
  string client_msg_id = 3;
  int32 type = 4;
  string content = 5;
  int64 created_at_ns = 6;
  // 正式消息由编号器统一赋值，重投时保持不变。
  int64 message_id = 7;
  int64 room_seq = 8;
}
