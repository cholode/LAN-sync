

networks:
  lan-im-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:      # 物理卷：缓存持久化
  kafka_data:      # 物理卷：消息积压持久化

services:
  # --- [1] 持久层：MySQL ---
  db:
    image: mysql:8.0
    container_name: im-mysql
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql-custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- [2] 缓存层：Redis ---
  redis:
    image: redis:7.0-alpine
    container_name: im-redis
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # --- [3] 消息中间件：Kafka (KRaft 模式) ---
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: always
    networks:
      - lan-im-network
    ports:
      - "9092:9092"
    environment:
      # [核心] 集群唯一物理身份证
      CLUSTER_ID: "lan-im-go-cluster-1024"
      # [角色] 开启 KRaft 模式，同时兼任数据节点(broker)和管理节点(controller)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      # [网络] 物理监听边界设定
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # [防线] 集群选票收割机指向自己
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      # [单机优化] 强制降维副本数，防止本地单机测试时报错
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  # --- [4] 业务算力层：Go Backend ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: im-backend
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
     - "8080:8080"
     - "6060:6060"
    environment:
      - DB_DSN=root:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local
      # 新增：注入中间件连接地址，供 Go 代码内部调用
      - REDIS_ADDR=redis:6379
      - KAFKA_ADDR=kafka:9092
      - LAN_IM_DATA_DIR=/app/data
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # --- [5] 接入层：Nginx ---
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    #image: nginx:alpine
    container_name: im-nginx
    restart: unless-stopped
    #network_mode: "host"
    networks:
      - lan-im-network
    ports:
      - "80:80"
      - "443:443"

    volumes:
      # - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
      # 与 backend 持久化目录一致（当前下载走 API；挂载便于日后做静态直链或运维查看）
      - ./data_storage/uploads:/var/www/uploads:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - backend