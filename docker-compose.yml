networks:
  lan-im-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  kafka_data:

services:
  # --- [1] 持久层：MySQL ---
  db:
    image: mysql:8.0
    container_name: im-mysql
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql-custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- [2] 缓存层：Redis ---
  redis:
    image: redis:7.0-alpine
    container_name: im-redis
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # --- [3] 消息中间件：Kafka (KRaft 模式) ---
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: always
    networks:
      - lan-im-network
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "lan-im-go-cluster-1024"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # [核心修复] 必须指向容器名，打破 localhost 选举死锁
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  # --- [4] 业务算力层：Go Backend ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: im-backend
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
     - "8080:8080"
     - "6060:6060"
    environment:
      - DB_DSN=root:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - KAFKA_ADDR=kafka:9092
      - LAN_IM_DATA_DIR=/app/data
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # --- [5] 接入层：Nginx ---
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: im-nginx
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # [核心修复] 挂载前端的编译产物目录 dist，而不是源码目录
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./data_storage/uploads:/var/www/uploads:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - backend