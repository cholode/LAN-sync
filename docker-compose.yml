networks:
  lan-im-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  es_data:
  kafka_data:
  qdrant_data:
  minio_data:
  prometheus_data:
  grafana_data:

services:
  # --- [1] 持久层：MySQL ---
  db:
    image: ${DOCKER_HUB_MIRROR:-dockerproxy.net}/library/mysql:8.0
    container_name: im-mysql
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql-custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- [2] 缓存层：Redis ---
  redis:
    image: ${DOCKER_HUB_MIRROR:-dockerproxy.net}/library/redis:7.0-alpine
    container_name: im-redis
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # --- [2.3] Search: Elasticsearch ---
  elasticsearch:
    image: ${ELASTIC_IMAGE:-dockerproxy.net/library/elasticsearch:8.17.0}
    container_name: im-elasticsearch
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # --- [2.5] Message Storage: MongoDB ---
  mongo:
    image: ${DOCKER_HUB_MIRROR:-dockerproxy.net}/library/mongo:7.0
    container_name: im-mongo
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- [3] 消息中间件：Kafka (KRaft 模式) ---
  kafka:
    image: ${DOCKER_HUB_MIRROR:-dockerproxy.net}/apache/kafka:latest
    container_name: kafka
    restart: always
    networks:
      - lan-im-network
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "lan-im-go-cluster-1024"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  # --- [4] 业务算力层：Go Backend ---
  backend:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile.monolith
    container_name: im-backend
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
     - "8080:8080"
     - "6060:6060"
    environment:
      - DB_DSN=root:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-0}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-0}
      - REDIS_DIAL_TIMEOUT=${REDIS_DIAL_TIMEOUT:-5s}
      - REDIS_READ_TIMEOUT=${REDIS_READ_TIMEOUT:-3s}
      - REDIS_WRITE_TIMEOUT=${REDIS_WRITE_TIMEOUT:-3s}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-im_chat_messages}
      - KAFKA_ARCHIVER_GROUP=${KAFKA_ARCHIVER_GROUP:-im_archiver_group}
      - KAFKA_PRODUCER_ASYNC=${KAFKA_PRODUCER_ASYNC:-true}
      - MESSAGE_STORE=${MESSAGE_STORE:-mysql}
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-lan_im}
      - ES_ENABLED=${ES_ENABLED:-true}
      - ES_ADDR=http://elasticsearch:9200
      - ES_INDEX_MESSAGES=${ES_INDEX_MESSAGES:-lan-im-messages}
      - QDRANT_HOST=qdrant
      - ADMIN_CONTROL_GRPC_ENABLED=${ADMIN_CONTROL_GRPC_ENABLED:-true}
      - ADMIN_CONTROL_GRPC_ADDR=0.0.0.0:50053
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - EMBED_BASE_URL=${EMBED_BASE_URL}
      - EMBED_API_KEY=${EMBED_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - SERVER_PORT=${SERVER_PORT}
      - ADMIN_CONTROL_TOKEN=${ADMIN_CONTROL_TOKEN:-change-me-admin-token}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_ADDR=${METRICS_ADDR:-0.0.0.0:6060}
      - METRICS_PATH=${METRICS_PATH:-/metrics}
      - NODE_ID=${NODE_ID:-lan-im-node-1}
      - JWT_SECRET=${JWT_SECRET}
      - TOPIC_CHUNK_INTERVAL=${TOPIC_CHUNK_INTERVAL}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-lan-im-files}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # --- [4.5] 独立管理控制面服务 ---
  admin-service:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    container_name: im-admin
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "${ADMIN_HTTP_PORT:-8081}:8081"
    environment:
      - DB_DSN=root:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - MESSAGE_STORE=${MESSAGE_STORE:-mongo}
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-lan_im}
      - ADMIN_HTTP_PORT=8081
      - ADMIN_CONTROL_GRPC_ADDR=backend:50053
      - ADMIN_CONTROL_TOKEN=${ADMIN_CONTROL_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-lan-im-files}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_started

  # --- [5] 向量数据库：Qdrant ---
  qdrant:
    image: ${DOCKER_HUB_MIRROR:-dockerproxy.net}/qdrant/qdrant:latest
    container_name: im-qdrant
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # --- [5.5] 对象存储：MinIO ---
  minio:
    image: ${DOCKER_HUB_MIRROR:-dockerproxy.net}/minio/minio:latest
    container_name: im-minio
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # --- [5.6] AI Agent Service: LangChain + LangGraph (gRPC) ---
  agent-service:
    build:
      context: ./services/agent/runtime
    container_name: im-agent
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "${AGENT_HTTP_PORT:-8000}:8000"
    volumes:
      - ./services/agent/runtime/config.yaml:/app/config.yaml:ro
    environment:
      - AGENT_CONFIG_PATH=/app/config.yaml
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBED_API_KEY=${EMBED_API_KEY}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-im_chat_messages}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      backend:
        condition: service_started

  agent-worker:
    build:
      context: ./services/agent/runtime
    container_name: im-agent-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    networks:
      - lan-im-network
    volumes:
      - ./services/agent/runtime/config.yaml:/app/config.yaml:ro
    environment:
      - AGENT_CONFIG_PATH=/app/config.yaml
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBED_API_KEY=${EMBED_API_KEY}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-im_chat_messages}
      - AGENT_KAFKA_GROUP=${AGENT_KAFKA_GROUP:-agent_service}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
      backend:
        condition: service_started

  # --- [5.7] 可观测性：Prometheus 指标采集与存储 ---
  prometheus:
    image: ${DOCKER_HUB_MIRROR:-dockerproxy.net}/prom/prometheus:v2.55.1
    container_name: im-prometheus
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # --- [5.8] 可观测性：Grafana 指标看板 ---
  grafana:
    image: ${DOCKER_HUB_MIRROR:-dockerproxy.net}/grafana/grafana:11.2.2
    container_name: im-grafana
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # --- [6] 接入层：Nginx ---
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: im-nginx
    restart: unless-stopped
    networks:
      - lan-im-network
    ports:
      - "80:80"
    environment:
      # 只替换以下部署变量，避免误替换模板中的 $host、$uri 等 Nginx 变量。
      - NGINX_ENVSUBST_FILTER=^(NGINX_SERVER_NAME|BACKEND_HOST|BACKEND_PORT|ADMIN_HOST|ADMIN_PORT)$$
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-_}
      - BACKEND_HOST=${NGINX_BACKEND_HOST:-backend}
      - BACKEND_PORT=${NGINX_BACKEND_PORT:-8080}
      - ADMIN_HOST=${NGINX_ADMIN_HOST:-admin-service}
      - ADMIN_PORT=${NGINX_ADMIN_PORT:-8081}
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - backend
      - admin-service
