<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAN-IM 超级管理员后台</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif; background: #f4f6fb; color: #1f2937; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 360px; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 12px 30px rgba(15,23,42,.08); }
    h1 { font-size: 20px; margin: 0 0 18px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #475569; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #dc2626; font-size: 13px; min-height: 20px; margin-top: 8px; }
    .alerts-badge { background: #fee2e2; color: #b91c1c; padding: 8px 12px; border-radius: 8px; margin-bottom: 14px; font-weight: 600; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    aside { background: #111827; color: #e5e7eb; padding: 18px 12px; }
    aside h1 { color: #fff; font-size: 16px; padding: 0 8px 14px; }
    aside a { display: block; color: #cbd5e1; text-decoration: none; padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; }
    aside a.active, aside a:hover { background: #1f2937; color: #fff; }
    main { padding: 24px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .placeholder { background: #fff; border-radius: 12px; padding: 32px; color: #64748b; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .metric-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 8px 20px rgba(15,23,42,.05); }
    .metric-value { font-size: 28px; font-weight: 700; color: #111827; }
    .metric-label { margin-top: 6px; color: #64748b; font-size: 13px; }
    .loading { color: #64748b; }
    .admin-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; margin: 10px 0 22px; }
    .admin-table th, .admin-table td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .admin-table th { background: #f8fafc; color: #475569; }
  </style>
</head>
<body>
  <div id="login" class="login-wrap">
    <form class="login-card" id="loginForm">
      <h1>超级管理员后台</h1>
      <label>管理员账号</label>
      <input id="username" name="username" autocomplete="username" required />
      <label>密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="loginBtn" type="submit">登录</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <div id="shell" class="shell" style="display:none">
    <aside>
      <h1>管理后台</h1>
      <a href="#dashboard" data-page="dashboard" class="active">Dashboard</a>
      <a href="#message-traffic" data-page="message-traffic">消息流量</a>
      <a href="#agent" data-page="agent">Agent监控</a>
      <a href="#agent-config" data-page="agent-config">Agent配置</a>
      <a href="#tool-calls" data-page="tool-calls">Tool Calls</a>
      <a href="#errors" data-page="errors">系统错误</a>
      <a href="#alerts" data-page="alerts">告警中心</a>
      <a href="#rag" data-page="rag">RAG/Qdrant</a>
      <a href="#moderation" data-page="moderation">内容审核</a>
      <a href="#users" data-page="users">用户管理</a>
      <a href="#rooms" data-page="rooms">房间管理</a>
      <a href="#connections" data-page="connections">连接管理</a>
      <a href="#files" data-page="files">文件管理</a>
      <a href="#audit-logs" data-page="audit-logs">审计日志</a>
    </aside>
    <main>
      <div class="toolbar">
        <h2 id="pageTitle">Dashboard</h2>
        <button id="logoutBtn" style="width:auto;background:#475569">退出</button>
      </div>
      <div id="content" class="placeholder">请选择左侧菜单进入超级管理员后台 /api/v1/admin/*</div>
    </main>
  </div>

  <script>
    const API_BASE = '/api/v1';
    const tokenKey = 'lan_im_admin_token';
    const userKey = 'lan_im_admin_user';
    const pageTitles = {
      dashboard: 'Dashboard',
      'message-traffic': '消息流量',
      agent: 'Agent监控',
      'agent-config': 'Agent配置',
      'tool-calls': 'Tool Calling 运行记录',
      errors: '系统错误中心',
      alerts: '告警中心',
      'audit-logs': '审计日志',
      rag: 'RAG/Qdrant',
      moderation: '内容审核',
      users: '用户管理',
      rooms: '房间管理',
      connections: '连接管理',
      files: '文件管理',
      'audit-logs': '审计日志'
    };

    function getToken() { return localStorage.getItem(tokenKey); }
    function setSession(token, user) {
      localStorage.setItem(tokenKey, token);
      localStorage.setItem(userKey, JSON.stringify(user || null));
    }
    function clearSession() {
      localStorage.removeItem(tokenKey);
      localStorage.removeItem(userKey);
    }

    function showLogin() {
      document.getElementById('login').style.display = 'flex';
      document.getElementById('shell').style.display = 'none';
    }
    function showShell() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('shell').style.display = 'grid';
    }

    async function login(username, password) {
      const res = await fetch(API_BASE + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.msg || '登录失败');
      const role = Number(data.user && data.user.role);
      if (role < 1) throw new Error('当前账号没有管理员权限');
      setSession(data.token, data.user);
      showShell();
      selectPage('dashboard');
    }

    function selectPage(page) {
      document.querySelectorAll('aside a').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
      document.getElementById('pageTitle').textContent = pageTitles[page] || page;
      if (page === 'dashboard') {
        loadDashboard();
      } else if (page === 'message-traffic') {
        loadMessageTraffic();
      } else if (page === 'agent') {
        loadAgentDashboard();
      } else if (page === 'rag') {
        loadRAGDashboard();
      } else if (page === 'moderation') {
        loadModerationDashboard();
      } else if (page === 'users') {
        loadUsers();
      } else if (page === 'rooms') {
        loadRooms();
      } else if (page === 'connections') {
        loadConnections();
      } else if (page === 'files') {
        loadFiles();
      } else if (page === 'agent-config') {
        loadAgentConfigPage();
      } else if (page === 'tool-calls') {
        loadToolCalls();
      } else if (page === 'errors') {
        loadErrors();
      } else if (page === 'audit-logs') {
        loadAuditLogs();
      } else if (page === 'alerts') {
        loadAlerts();
      } else {
        document.getElementById('content').textContent = '功能尚未实现：' + (pageTitles[page] || page) + '，请访问 /api/v1/admin/*';
      }
    }

    async function request(endpoint, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      const token = getToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(API_BASE + endpoint, Object.assign({}, options, { headers }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.msg || '请求失败');
      return data;
    }

    function metricCard(label, value) {
      return '<div class="metric-card"><div class="metric-value">' + value + '</div><div class="metric-label">' + label + '</div></div>';
    }

    async function loadDashboard() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在加载 Dashboard...</div>';
      try {
        const data = await request('/admin/dashboard/overview');
        const u = data.sections.users;
        const r = data.sections.rooms;
        const m = data.sections.messages;
        const rt = data.sections.realtime;
        content.innerHTML = '<div class="metric-grid">' +
          metricCard('用户总数', u.total) +
          metricCard('今日新增用户', u.new_today) +
          metricCard('7 日新增用户', u.new_last_7_days) +
          metricCard('30 日新增用户', u.new_last_30_days) +
          metricCard('当前在线用户', u.online) +
          metricCard('当前 WebSocket 连接', rt.websocket_connections) +
          metricCard('今日活跃用户 DAU', u.active_today) +
          metricCard('7 日活跃用户 WAU', u.active_last_7_days) +
          metricCard('30 日活跃用户 MAU', u.active_last_30_days) +
          metricCard('群聊总数', r.total) +
          metricCard('今日新增群聊', r.new_today) +
          metricCard('今日消息数', m.today) +
          metricCard('今日私聊消息', m.private_today) +
          metricCard('今日群聊消息', m.group_today) +
          metricCard('今日文件消息', m.file_today) +
          metricCard('今日 @Agent 消息', m.agent_today) +
          '</div>';

        const ws = data.websocket || {};
        content.insertAdjacentHTML('beforeend', '<h3 style="margin:22px 0 12px">WebSocket 运行状态</h3><div class="metric-grid">' +
          metricCard('当前连接', ws.current_connections || 0) +
          metricCard('累计建立连接', ws.established_total || 0) +
          metricCard('累计关闭连接', ws.closed_total || 0) +
          metricCard('异常关闭连接', ws.abnormal_closed_total || 0) +
          metricCard('平均连接时长(ms)', Math.round(ws.average_connection_duration_ms || 0)) +
          metricCard('每分钟读消息', ws.read_messages_per_minute || 0) +
          metricCard('每分钟写消息', ws.write_messages_per_minute || 0) +
          metricCard('发送队列积压', ws.send_queue_backlog || 0) +
          metricCard('慢客户端', ws.slow_clients || 0) +
          '</div>');

        const mod = data.moderation || {};
        content.insertAdjacentHTML('beforeend', '<h3 style="margin:22px 0 12px">AI 内容审核概览</h3><div class="metric-grid">' +
          metricCard('今日审核', mod.today_reviewed || 0) +
          metricCard('今日违规', mod.today_violations || 0) +
          metricCard('违规率', ((mod.violation_rate || 0) * 100).toFixed(2) + '%') +
          metricCard('待人工复核', mod.pending_reviews || 0) +
          '</div>');

        const agent = data.agent || {};
        content.insertAdjacentHTML('beforeend', '<h3 style="margin:22px 0 12px">Agent 运行概览</h3><div class="metric-grid">' +
          metricCard('累计调用', agent.calls_today || 0) +
          metricCard('当前请求', agent.current_requests || 0) +
          metricCard('成功率', ((agent.success_rate || 0) * 100).toFixed(2) + '%') +
          metricCard('平均响应(ms)', (agent.average_response_ms || 0).toFixed(2)) +
          metricCard('总 Token', agent.total_tokens || 0) +
          metricCard('Tool Calling', agent.tool_calls || 0) +
          metricCard('RAG 调用', agent.rag_calls || 0) +
          metricCard('Embedding 调用', agent.embedding_calls || 0) +
          '</div>');

        const rag = data.rag || {};
        content.insertAdjacentHTML('beforeend', '<h3 style="margin:22px 0 12px">RAG / Qdrant</h3><div class="metric-grid">' +
          metricCard('Qdrant', rag.qdrant_online ? '在线' : '离线') +
          metricCard('Collection 数', rag.collection_count || 0) +
          metricCard('向量总数', rag.vector_count || 0) +
          metricCard('今日新增向量', rag.today_new_vectors || 0) +
          metricCard('Top K', rag.top_k || 0) +
          metricCard('向量维度', rag.vector_dimension || 0) +
          '</div>');

        const systemItems = data.system || [];
        const healthRows = systemItems.map(item => '<div class="metric-card"><div class="metric-value">' + item.status + '</div><div class="metric-label">' + item.name + ' (' + Number(item.latency_ms || 0).toFixed(2) + 'ms)</div>' + (item.error ? '<div class="error">' + item.error + '</div>' : '') + '</div>').join('');
        content.insertAdjacentHTML('beforeend', '<h3 style="margin:22px 0 12px">System Health</h3><div class="metric-grid">' + healthRows + '</div>');

        loadAlertBadge();
        loadQuickActions();
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function loadConnections() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在加载连接列表...</div>';
      try {
        const data = await request('/admin/connections');
        const rows = (data.items || []).map(item => '<tr><td>' + item.user_id + '</td><td>' + item.username + '</td><td>' + item.connection_id + '</td><td>' + item.remote_ip + '</td><td>' + new Date(item.connected_at).toLocaleString() + '</td><td>' + Math.round((Date.now() - new Date(item.connected_at).getTime()) / 1000) + 's</td><td>' + new Date(item.last_read_at).toLocaleString() + '</td><td>' + new Date(item.last_write_at).toLocaleString() + '</td><td>' + item.send_queue_len + '</td><td>' + (item.room_ids || []).join(',') + '</td><td>' +
          '<button onclick="connectionClose(\'' + item.connection_id + '\')">关闭连接</button> ' +
          '<button onclick="connectionForceOffline(' + item.user_id + ')">强制下线</button>' +
          '</td></tr>').join('');
        content.innerHTML = '<h3 style="margin-top:0">连接列表</h3><table class="admin-table"><thead><tr><th>用户ID</th><th>用户名</th><th>Connection ID</th><th>Remote IP</th><th>连接时间</th><th>在线时长</th><th>最后读取</th><th>最后写入</th><th>Send Queue</th><th>房间</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function connectionClose(connectionId) {
      if (!confirm('确定关闭连接 ' + connectionId + ' 吗？')) return;
      try {
        await request('/admin/connections/close', {
          method: 'POST',
          body: JSON.stringify({ connection_id: connectionId })
        });
        alert('连接已关闭');
        loadConnections();
      } catch (error) {
        alert(error.message);
      }
    }

    async function connectionForceOffline(userId) {
      if (!confirm('确定强制该用户下线 ' + userId + ' 吗？')) return;
      try {
        await request('/admin/connections/force-offline', {
          method: 'POST',
          body: JSON.stringify({ user_id: userId })
        });
        alert('用户已强制下线');
        loadConnections();
      } catch (error) {
        alert(error.message);
      }
    }
    window.connectionClose = connectionClose;
    window.connectionForceOffline = connectionForceOffline;

    async function loadAuditLogs() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在加载审计日志...</div>';
      try {
        const keyword = document.getElementById('auditKeyword') ? document.getElementById('auditKeyword').value : '';
        const action = document.getElementById('auditAction') ? document.getElementById('auditAction').value : '';
        const targetType = document.getElementById('auditTargetType') ? document.getElementById('auditTargetType').value : '';
        const params = new URLSearchParams({ page: 1, page_size: 50 });
        if (keyword) params.set('keyword', keyword);
        if (action) params.set('action', action);
        if (targetType) params.set('target_type', targetType);
        const data = await request('/admin/audit-logs?' + params.toString());
        const rows = (data.items || []).map(item => '<tr><td>' + item.id + '</td><td>' + item.admin_user_id + ' (' + item.admin_username + ')</td><td>' + item.action + '</td><td>' + item.target_type + '</td><td>' + item.target_id + '</td><td>' + item.request_id + '</td><td>' + item.remote_ip + '</td><td>' + item.result + '</td><td>' + new Date(item.created_at).toLocaleString() + '</td><td>' + (item.error_message || '') + '</td></tr>').join('');
        content.innerHTML = '<div class="toolbar"><input id="auditKeyword" placeholder="关键字"><input id="auditAction" placeholder="动作"><input id="auditTargetType" placeholder="目标类型"><button onclick="loadAuditLogs()">查询</button></div>' +
          '<h3 style="margin-top:14px">审计日志</h3><table class="admin-table"><thead><tr><th>ID</th><th>管理员</th><th>动作</th><th>目标类型</th><th>目标ID</th><th>Request ID</th><th>IP</th><th>结果</th><th>时间</th><th>错误信息</th></tr></thead><tbody>' + rows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    window.loadAuditLogs = loadAuditLogs;

    async function loadErrors() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在加载系统错误...</div>';
      try {
        const module = document.getElementById('errorModule') ? document.getElementById('errorModule').value : '';
        const errorType = document.getElementById('errorType') ? document.getElementById('errorType').value : '';
        const resolved = document.getElementById('errorResolved') ? document.getElementById('errorResolved').value : '';
        const params = new URLSearchParams({ page: 1, page_size: 50 });
        if (module) params.set('module', module);
        if (errorType) params.set('error_type', errorType);
        if (resolved) params.set('resolved', resolved);
        const data = await request('/admin/errors?' + params.toString());
        const rows = (data.items || []).map(item => '<tr><td>' + item.id + '</td><td>' + new Date(item.timestamp).toLocaleString() + '</td><td>' + item.module + '</td><td>' + item.error_type + '</td><td>' + item.error_message + '</td><td>' + item.request_id + '</td><td>' + item.user_id + '</td><td>' + item.room_id + '</td><td>' + (item.resolved ? '已处理' : '未处理') + '</td><td><button onclick="resolveError(' + item.id + ')">标记已处理</button></td></tr>').join('');
        content.innerHTML = '<div class="toolbar"><input id="errorModule" placeholder="模块"><input id="errorType" placeholder="错误类型"><select id="errorResolved"><option value="">全部</option><option value="false">未处理</option><option value="true">已处理</option></select><button onclick="loadErrors()">查询</button></div>' +
          '<h3 style="margin-top:14px">系统错误中心</h3><table class="admin-table"><thead><tr><th>ID</th><th>时间</th><th>模块</th><th>错误类型</th><th>错误信息</th><th>Request ID</th><th>用户ID</th><th>群聊ID</th><th>状态</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function resolveError(id) {
      try {
        await request('/admin/errors/' + id + '/resolve', { method: 'POST' });
        alert('已标记为已处理');
        loadErrors();
      } catch (error) {
        alert(error.message);
      }
    }

    window.loadErrors = loadErrors;
    window.resolveError = resolveError;

    async function loadToolCalls() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在加载 Tool Calling 记录...</div>';
      try {
        const toolName = document.getElementById('toolCallToolName') ? document.getElementById('toolCallToolName').value : '';
        const userId = document.getElementById('toolCallUserId') ? document.getElementById('toolCallUserId').value : '';
        const roomId = document.getElementById('toolCallRoomId') ? document.getElementById('toolCallRoomId').value : '';
        const success = document.getElementById('toolCallSuccess') ? document.getElementById('toolCallSuccess').value : '';
        const params = new URLSearchParams({ page: 1, page_size: 50 });
        if (toolName) params.set('tool_name', toolName);
        if (userId) params.set('user_id', userId);
        if (roomId) params.set('room_id', roomId);
        if (success) params.set('success', success);
        const data = await request('/admin/tool-calls?' + params.toString());
        const rows = (data.items || []).map(item => '<tr><td>' + item.id + '</td><td>' + item.tool_call_id + '</td><td>' + item.agent_request_id + '</td><td>' + item.user_id + ' (' + item.username + ')</td><td>' + item.room_id + ' (' + item.room_name + ')</td><td>' + item.tool_name + '</td><td>' + item.arguments + '</td><td>' + new Date(item.started_at).toLocaleString() + '</td><td>' + new Date(item.finished_at).toLocaleString() + '</td><td>' + item.latency_ms.toFixed(2) + '</td><td>' + (item.success ? '成功' : '失败') + '</td><td>' + (item.error || '') + '</td></tr>').join('');
        content.innerHTML = '<div class="toolbar"><input id="toolCallToolName" placeholder="Tool名称"><input id="toolCallUserId" placeholder="用户ID"><input id="toolCallRoomId" placeholder="群聊ID"><select id="toolCallSuccess"><option value="">全部</option><option value="true">成功</option><option value="false">失败</option></select><button onclick="loadToolCalls()">查询</button></div>' +
          '<h3 style="margin-top:14px">Tool Calling 运行记录</h3><table class="admin-table"><thead><tr><th>ID</th><th>Tool Call ID</th><th>Agent Request ID</th><th>用户</th><th>群聊</th><th>工具名称</th><th>参数</th><th>开始时间</th><th>结束时间</th><th>耗时(ms)</th><th>结果</th><th>错误</th></tr></thead><tbody>' + rows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    window.loadToolCalls = loadToolCalls;

    async function loadAgentConfigPage() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在加载 Agent 配置...</div>';
      try {
        const cfg = await request('/admin/agent-config');
        content.innerHTML = '<h3 style="margin-top:0">全局 Agent 配置</h3>' +
          '<div class="toolbar"><button onclick="agentConfigSave()">保存配置</button> <button onclick="agentConfigRollback()">回滚上一版本</button> <button onclick="agentConfigHistory()">历史记录</button></div>' +
          '<div class="form-grid">' +
          agentField('global_enabled', '全局启用', 'checkbox', cfg.global_enabled) +
          agentField('default_model', '默认模型', 'text', cfg.default_model) +
          agentField('embedding_model', 'Embedding 模型', 'text', cfg.embedding_model) +
          agentField('temperature', 'Temperature', 'number', cfg.temperature) +
          agentField('max_tokens', 'Max Tokens', 'number', cfg.max_tokens) +
          agentField('rag_top_k', 'RAG Top-K', 'number', cfg.rag_top_k) +

    function readAgentConfigInputs() {
      const names = [
        'global_enabled', 'default_model', 'embedding_model', 'temperature', 'max_tokens',
        'rag_top_k', 'rag_similarity_threshold', 'chunk_size', 'chunk_overlap',
        'moderation_enabled', 'moderation_model', 'moderation_threshold',
        'tool_calling_enabled', 'auto_kick_enabled', 'auto_ban_enabled',
        'system_prompt', 'moderation_prompt', 'rag_prompt', 'tool_calling_prompt'
      ];
      const body = {};
      names.forEach(name => {
        const el = document.getElementById('cfg_' + name);
        if (!el) return;
        if (el.type === 'checkbox') {
          body[name] = el.checked;
        } else if (el.type === 'number') {
          body[name] = Number(el.value);
        } else {
          body[name] = el.value;
        }
      });
      return body;
    }

      if (!keyword) return alert('请输入用户搜索关键字');
      selectPage('users');
      loadUsers(keyword);
    }

    async function quickRoomSearch() {
      const keyword = document.getElementById('quickRoomKeyword').value.trim();
      if (!keyword) return alert('请输入群聊搜索关键字');
      selectPage('rooms');
      loadRooms(keyword);
    }

    window.quickUserSearch = quickUserSearch;
    window.quickRoomSearch = quickRoomSearch;

    async function loadAlertBadge() {
      const content = document.getElementById('content');
      try {
        const data = await request('/admin/alerts/unresolved-count');
        content.insertAdjacentHTML('afterbegin', '<div class="alerts-badge">未处理告警：' + data.count + '</div>');
      } catch (error) {
        // Dashboard 主要数据不受告警计数失败影响。
      }
    }

    async function loadAlerts() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在加载告警中心...</div>';
      try {
        const level = document.getElementById('alertLevel') ? document.getElementById('alertLevel').value : '';
        const status = document.getElementById('alertStatus') ? document.getElementById('alertStatus').value : '';
        const params = new URLSearchParams({ page: 1, page_size: 50 });
        if (level) params.set('level', level);
        if (status) params.set('status', status);
        const data = await request('/admin/alerts?' + params.toString());
        const rows = (data.items || []).map(item => '<tr><td>' + item.id + '</td><td>' + item.name + '</td><td>' + item.level + '</td><td>' + item.source + '</td><td>' + item.message + '</td><td>' + item.status + '</td><td>' + new Date(item.created_at).toLocaleString() + '</td><td><button onclick="resolveAlert(' + item.id + ')">处理</button></td></tr>').join('');
        content.innerHTML = '<div class="toolbar"><select id="alertLevel"><option value="">全部级别</option><option value="info">Info</option><option value="warning">Warning</option><option value="critical">Critical</option></select><select id="alertStatus"><option value="">全部状态</option><option value="unresolved">未处理</option><option value="resolved">已处理</option></select><button onclick="loadAlerts()">查询</button> <button onclick="evaluateAlerts()">立即评估</button></div>' +
          '<h3 style="margin-top:14px">告警中心</h3><table class="admin-table"><thead><tr><th>ID</th><th>名称</th><th>级别</th><th>来源</th><th>信息</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function resolveAlert(id) {
      try {
        await request('/admin/alerts/' + id + '/resolve', { method: 'POST' });
        alert('已处理');
        loadAlerts();
      } catch (error) {
        alert(error.message);
      }
    }

    async function evaluateAlerts() {
      try {
        await request('/admin/alerts/evaluate', { method: 'POST' });
        alert('告警评估完成');
        loadAlerts();
      } catch (error) {
        alert(error.message);
      }
    }

    window.loadAlerts = loadAlerts;
    window.resolveAlert = resolveAlert;
    window.evaluateAlerts = evaluateAlerts;

    async function loadHealthCards() {
      const content = document.getElementById('content');
      try {
        const data = await request('/admin/health');
        const rows = (data.items || []).map(item => '<div class="metric-card"><div class="metric-value">' + item.status + '</div><div class="metric-label">' + item.name + ' (' + item.latency_ms.toFixed(2) + 'ms)</div>' + (item.error ? '<div class="error">' + item.error + '</div>' : '') + '</div>').join('');
        content.insertAdjacentHTML('beforeend', '<h3 style="margin-top:22px">System Health</h3><div class="metric-grid">' + rows + '</div>');
      } catch (error) {
        content.insertAdjacentHTML('beforeend', '<div class="error">健康检查失败：' + error.message + '</div>');
      }
    }

    async function loadMessageTraffic() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在加载审核看板...</div>';
      try {
        const data = await request('/admin/dashboard/message-traffic');
        const hourRows = (data.hourly || []).map(item => '<tr><td>' + item.time + '</td><td>' + item.count + '</td></tr>').join('');
        const dayRows = (data.daily || []).map(item => '<tr><td>' + item.time + '</td><td>' + item.count + '</td></tr>').join('');
        const roomRows = (data.top_rooms || []).map(item => '<tr><td>' + item.key + '</td><td>' + item.count + '</td></tr>').join('');
        const userRows = (data.top_users || []).map(item => '<tr><td>' + item.key + '</td><td>' + item.count + '</td></tr>').join('');
        const typeRows = Object.entries(data.type_distribution || {}).map(([k, v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('');
        content.innerHTML = '<h3 style="margin-top:0">消息流量概览</h3>' +
          '<div class="metric-grid">' +
          metricCard('私聊消息', data.private_group.private) +
          metricCard('群聊消息', data.private_group.group) +
          metricCard('高峰时段', data.peak_hour || '-') +
          '</div>' +
          '<h3>消息类型分布</h3><table class="admin-table"><thead><tr><th>类型</th><th>消息数</th></tr></thead><tbody>' + typeRows + '</tbody></table>' +
          '<h3>近 24 小时趋势</h3><table class="admin-table"><thead><tr><th>时间</th><th>消息数</th></tr></thead><tbody>' + hourRows + '</tbody></table>' +
          '<h3>近 7 天趋势</h3><table class="admin-table"><thead><tr><th>日期</th><th>消息数</th></tr></thead><tbody>' + dayRows + '</tbody></table>' +
          '<h3>活跃房间 Top 10</h3><table class="admin-table"><thead><tr><th>Room ID</th><th>消息数</th></tr></thead><tbody>' + roomRows + '</tbody></table>' +
          '<h3>活跃用户 Top 10</h3><table class="admin-table"><thead><tr><th>User ID</th><th>消息数</th></tr></thead><tbody>' + userRows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function loadRuntime() {
      const content = document.getElementById('content');
      try {
        const data = await request('/admin/dashboard/runtime');
        const ws = data.websocket;
        const go = data.golang;
        const api = data.api;
        const html = '<h3 style="margin:22px 0 12px">运行时指标</h3>' +
          '<div class="metric-grid">' +
          metricCard('当前连接数', ws.current_connections) +
          metricCard('累计连接数', ws.established_total) +
          metricCard('累计关闭数', ws.closed_total) +
          metricCard('异常关闭数', ws.abnormal_closed_total) +
          metricCard('平均连接时长(ms)', Math.round(ws.average_connection_duration_ms)) +
          metricCard('每分钟读消息', ws.read_messages_per_minute) +
          metricCard('每分钟写消息', ws.write_messages_per_minute) +
          metricCard('发送队列积压', ws.send_queue_backlog) +
          metricCard('慢客户端数', ws.slow_clients) +
          metricCard('Goroutine 数', go.goroutines) +
          metricCard('GOMAXPROCS', go.gomaxprocs) +
          metricCard('Heap Alloc', go.heap_alloc) +
          metricCard('Heap Sys', go.heap_sys) +
          metricCard('GC 次数', go.gc_count) +
          metricCard('上次 GC 时间', go.last_gc_unix ? new Date(go.last_gc_unix * 1000).toLocaleString() : '-') +
          metricCard('GC Pause(ns)', go.gc_pause_ns) +
          metricCard('运行时长(s)', Math.round(go.uptime_seconds)) +
          metricCard('近 1 分钟 QPS', api.qps_1m.toFixed(2)) +
          metricCard('近 5 分钟 QPS', api.qps_5m.toFixed(2)) +
          metricCard('API 平均耗时(ms)', api.average_latency_ms.toFixed(2)) +
          metricCard('P50 延迟(ms)', api.p50_latency_ms.toFixed(2)) +
          metricCard('P95 延迟(ms)', api.p95_latency_ms.toFixed(2)) +
          metricCard('P99 延迟(ms)', api.p99_latency_ms.toFixed(2)) +
          metricCard('4xx 数量', api.status_4xx) +
          metricCard('5xx 数量', api.status_5xx) +
          metricCard('错误率', (api.error_rate * 100).toFixed(2) + '%') +
          '</div>';
        content.insertAdjacentHTML('beforeend', html);
      } catch (error) {
        content.insertAdjacentHTML('beforeend', '<div class="error">加载审核事件失败：' + error.message + '</div>');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.textContent = '';
      btn.disabled = true;
      try {
        await login(
          document.getElementById('username').value.trim(),
          document.getElementById('password').value
        );
      } catch (error) {
        err.textContent = error.message;
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearSession();
      showLogin();
    });

    document.querySelectorAll('aside a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectPage(a.dataset.page);
      });
    });

    if (getToken()) {
      const user = JSON.parse(localStorage.getItem(userKey) || 'null');
      const role = Number(user && user.role);
      if (role >= 1) {
        showShell();
        selectPage('dashboard');
      } else {
        clearSession();
        showLogin();
      }
    } else {
      showLogin();
    }
  </script>
</body>
</html>
