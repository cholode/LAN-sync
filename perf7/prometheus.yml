global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: lan-im-message-sequencer
    static_configs:
      - targets: ["message-sequencer:6062"]
        labels:
          service: message-sequencer
          project: lan-im-go
  - job_name: lan-im-message-api
    static_configs:
      - targets: [message-service:8083]
        labels:
          service: message
          project: lan-im-go

  - job_name: lan-im-message-worker
    static_configs:
      - targets: [message-worker:6061]
        labels:
          service: message-worker
          project: lan-im-go

  - job_name: lan-im-gateways
    scrape_interval: 1s
    metrics_path: /metrics
    static_configs:
      - targets: [backend:6060]
        labels:
          service: gateway
          node_id: gateway-1
          project: lan-im-go
      - targets: [gateway-2:6060]
        labels:
          service: gateway
          node_id: gateway-2
          project: lan-im-go
      - targets: [gateway-3:6060]
        labels:
          service: gateway
          node_id: gateway-3
          project: lan-im-go

  - job_name: lan-im-admin
    static_configs:
      - targets: [admin-service:8081]
        labels:
          service: admin
          project: lan-im-go

  - job_name: lan-im-room
    static_configs:
      - targets: [room-service:8082]
        labels:
          service: room
          project: lan-im-go

  - job_name: lan-im-agent-api
    static_configs:
      - targets: [agent-service:8000]
        labels:
          service: agent-api
          project: lan-im-go

  - job_name: lan-im-agent-worker
    static_configs:
      - targets: [agent-worker:8001]
        labels:
          service: agent-worker
          project: lan-im-go
