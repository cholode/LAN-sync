# Agent service configuration.
# Values containing ${VAR} are resolved from environment variables at startup.

grpc:
  host: "[::]"
  port: 50051
  max_workers: 10

llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: "${LLM_API_KEY}"
  model: "deepseek-chat"
  timeout_seconds: 60

embedding:
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${EMBED_API_KEY}"
  model: "doubao-embedding-vision-251215"
  dimension: 1024
  batch_size: 100
  timeout_seconds: 30

qdrant:
  host: "qdrant"
  grpc_port: 6334
  vector_size: 1024

redis:
  addr: "redis:6379"

kafka:
  brokers: "${KAFKA_BROKERS:-kafka:9092}"
  topic: "${KAFKA_TOPIC:-im_chat_messages}"
  group_id: "${AGENT_KAFKA_GROUP:-agent_service}"
  batch_size: 50
  batch_window_seconds: 60
  poll_interval_seconds: 1
  auto_offset_reset: "latest"

im_service:
  grpc_addr: "backend:50052"

database:
  url: "${AGENT_DATABASE_URL}"
  # 生产环境应配置只授予 SELECT 权限的独立数据库账号。
  query_url: "${AGENT_QUERY_DATABASE_URL}"
  query_max_rows: 100
  query_timeout_ms: 3000
  query_max_attempts: 3
  query_max_output_chars: 20000
  pool_size: 10
  max_overflow: 20
  pool_recycle_seconds: 3600
  echo: false

agent:
  cooldown_seconds: 5.0
  system_prompt: ""
  trigger_mode: 1
  trigger_words: []
  max_history: 20
  temperature: 0.7
  model_name: "deepseek-chat"
  rag_enabled: true
  top_k: 5
  similarity_thold: 0.7
  rerank_enabled: true
  max_chunk_tokens: 4000
  topic_chunk_min_msgs: 30
  topic_chunk_model: "deepseek-chat"
