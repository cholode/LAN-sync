<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAN-IM ???????</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif; background: #f4f6fb; color: #1f2937; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 360px; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 12px 30px rgba(15,23,42,.08); }
    h1 { font-size: 20px; margin: 0 0 18px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #475569; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #dc2626; font-size: 13px; min-height: 20px; margin-top: 8px; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    aside { background: #111827; color: #e5e7eb; padding: 18px 12px; }
    aside h1 { color: #fff; font-size: 16px; padding: 0 8px 14px; }
    aside a { display: block; color: #cbd5e1; text-decoration: none; padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; }
    aside a.active, aside a:hover { background: #1f2937; color: #fff; }
    main { padding: 24px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .placeholder { background: #fff; border-radius: 12px; padding: 32px; color: #64748b; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .metric-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 8px 20px rgba(15,23,42,.05); }
    .metric-value { font-size: 28px; font-weight: 700; color: #111827; }
    .metric-label { margin-top: 6px; color: #64748b; font-size: 13px; }
    .loading { color: #64748b; }
    .admin-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; margin: 10px 0 22px; }
    .admin-table th, .admin-table td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .admin-table th { background: #f8fafc; color: #475569; }
  </style>
</head>
<body>
  <div id="login" class="login-wrap">
    <form class="login-card" id="loginForm">
      <h1>???????</h1>
      <label>?????</label>
      <input id="username" name="username" autocomplete="username" required />
      <label>??</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="loginBtn" type="submit">??</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <div id="shell" class="shell" style="display:none">
    <aside>
      <h1>????</h1>
      <a href="#dashboard" data-page="dashboard" class="active">Dashboard</a>
      <a href="#message-traffic" data-page="message-traffic">????</a>
      <a href="#agent" data-page="agent">Agent??</a>
      <a href="#rag" data-page="rag">RAG/Qdrant</a>
      <a href="#moderation" data-page="moderation">????</a>
      <a href="#users" data-page="users">????</a>
      <a href="#rooms" data-page="rooms">????</a>
      <a href="#connections" data-page="connections">????</a>
      <a href="#files" data-page="files">????</a>
      <a href="#audit-logs" data-page="audit-logs">????</a>
    </aside>
    <main>
      <div class="toolbar">
        <h2 id="pageTitle">Dashboard</h2>
        <button id="logoutBtn" style="width:auto;background:#475569">??</button>
      </div>
      <div id="content" class="placeholder">????????????????? /api/v1/admin/*?</div>
    </main>
  </div>

  <script>
    const API_BASE = '/api/v1';
    const tokenKey = 'lan_im_admin_token';
    const userKey = 'lan_im_admin_user';
    const pageTitles = {
      dashboard: 'Dashboard',
      'message-traffic': '????',
      agent: 'Agent??',
      rag: 'RAG/Qdrant',
      moderation: '????',
      users: '????',
      rooms: '????',
      connections: '????',
      files: '????',
      'audit-logs': '????'
    };

    function getToken() { return localStorage.getItem(tokenKey); }
    function setSession(token, user) {
      localStorage.setItem(tokenKey, token);
      localStorage.setItem(userKey, JSON.stringify(user || null));
    }
    function clearSession() {
      localStorage.removeItem(tokenKey);
      localStorage.removeItem(userKey);
    }

    function showLogin() {
      document.getElementById('login').style.display = 'flex';
      document.getElementById('shell').style.display = 'none';
    }
    function showShell() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('shell').style.display = 'grid';
    }

    async function login(username, password) {
      const res = await fetch(API_BASE + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.msg || '????');
      const role = Number(data.user && data.user.role);
      if (role < 1) throw new Error('???????????????');
      setSession(data.token, data.user);
      showShell();
      selectPage('dashboard');
    }

    function selectPage(page) {
      document.querySelectorAll('aside a').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
      document.getElementById('pageTitle').textContent = pageTitles[page] || page;
      if (page === 'dashboard') {
        loadDashboard();
      } else if (page === 'message-traffic') {
        loadMessageTraffic();
      } else if (page === 'agent') {
        loadAgentDashboard();
      } else if (page === 'rag') {
        loadRAGDashboard();
      } else if (page === 'moderation') {
        loadModerationDashboard();
      } else {
        document.getElementById('content').textContent = '?????' + (pageTitles[page] || page) + '???????? /api/v1/admin/*?';
      }
    }

    async function request(endpoint) {
      const headers = { 'Content-Type': 'application/json' };
      const token = getToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(API_BASE + endpoint, { headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.msg || '????');
      return data;
    }

    function metricCard(label, value) {
      return '<div class="metric-card"><div class="metric-value">' + value + '</div><div class="metric-label">' + label + '</div></div>';
    }

    async function loadDashboard() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">???? Dashboard...</div>';
      try {
        const data = await request('/admin/dashboard/overview');
        const u = data.sections.users;
        const r = data.sections.rooms;
        const m = data.sections.messages;
        const rt = data.sections.realtime;
        content.innerHTML = '<div class="metric-grid">' +
          metricCard('???????', u.total) +
          metricCard('??????', u.new_today) +
          metricCard('7 ?????', u.new_last_7_days) +
          metricCard('30 ?????', u.new_last_30_days) +
          metricCard('???????', u.online) +
          metricCard('?? WebSocket ???', rt.websocket_connections) +
          metricCard('?????? DAU', u.active_today) +
          metricCard('7 ????? WAU', u.active_last_7_days) +
          metricCard('30 ????? MAU', u.active_last_30_days) +
          metricCard('??????', r.total) +
          metricCard('??????', r.new_today) +
          metricCard('????????', m.today) +
          metricCard('????????', m.private_today) +
          metricCard('????????', m.group_today) +
          metricCard('????????', m.file_today) +
          metricCard('?? @Agent ????', m.agent_today) +
          '</div>';
        loadRuntime();
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function loadModerationDashboard() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">??????????...</div>';
      try {
        const data = await request('/admin/dashboard/moderation');
        const catRows = (data.category_stats || []).map(item => '<tr><td>' + item.category + '</td><td>' + item.count + '</td></tr>').join('');
        const recentRows = (data.recent_violations || []).map(item => '<tr><td>' + new Date(item.created_at).toLocaleString() + '</td><td>' + item.username + '</td><td>' + item.room_name + '</td><td>' + item.original_msg + '</td><td>' + item.risk_level + '</td><td>' + item.category + '</td><td>' + item.penalty_status + '</td><td>' + item.review_status + '</td></tr>').join('');
        content.innerHTML = '<h3 style="margin-top:0">AI ??????</h3>' +
          '<div class="metric-grid">' +
          metricCard('???????', data.today_reviewed) +
          metricCard('???????', data.today_violations) +
          metricCard('???', (data.violation_rate * 100).toFixed(2) + '%') +
          metricCard('????????', data.auto_kick_count) +
          metricCard('????????', data.auto_ban_count) +
          metricCard('??????', data.manual_review_count) +
          metricCard('??????', data.revoked_count) +
          metricCard('Tool Calling ??????', data.tool_failure_count) +
          '</div>' +
          '<h3>??????</h3><table class="admin-table"><thead><tr><th>??</th><th>??</th></tr></thead><tbody>' + catRows + '</tbody></table>' +
          '<h3>??????</h3><table class="admin-table"><thead><tr><th>??</th><th>??</th><th>??</th><th>????</th><th>????</th><th>??</th><th>????</th><th>????</th></tr></thead><tbody>' + recentRows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function loadRAGDashboard() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">???? RAG/Qdrant ??...</div>';
      try {
        const data = await request('/admin/dashboard/rag');
        const queryData = await request('/admin/rag/queries?page=1&page_size=20');
        const queryRows = (queryData.items || []).map(item => '<tr><td>' + item.id + '</td><td>' + item.room_id + '</td><td>' + item.user_id + '</td><td>' + item.question + '</td><td>' + new Date(item.query_time).toLocaleString() + '</td><td>' + item.retrieved_count + '</td><td>' + item.similarity_scores + '</td><td>' + item.query_latency_ms + '</td><td>' + (item.used_time_tool ? '?' : '?') + '</td></tr>').join('');
        content.innerHTML = '<h3 style="margin-top:0">RAG / Qdrant ??</h3>' +
          '<div class="metric-grid">' +
          metricCard('Qdrant ????', data.qdrant_online ? '??' : '??') +
          metricCard('Collection ??', data.collection_count) +
          metricCard('??????????', data.vector_count) +
          metricCard('????????', data.today_new_vectors) +
          metricCard('Embedding Queue ?????', data.embedding_queue) +
          metricCard('Embedding ????(ms)', data.embedding_avg_ms.toFixed(2)) +
          metricCard('Qdrant ??????(ms)', data.qdrant_query_avg_ms.toFixed(2)) +
          metricCard('RAG ??????', data.rag_avg_recall.toFixed(2)) +
          metricCard('RAG Top-K ????', data.top_k) +
          metricCard('????', data.vector_dimension) +
          metricCard('????????', data.last_write_time ? new Date(data.last_write_time).toLocaleString() : '-') +
          '</div>' +
          '<h3>RAG ????</h3><table class="admin-table"><thead><tr><th>ID</th><th>??</th><th>??</th><th>??</th><th>????</th><th>???</th><th>???</th><th>??(ms)</th><th>??Tool</th></tr></thead><tbody>' + queryRows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function loadAgentDashboard() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">???? Agent ??...</div>';
      try {
        const data = await request('/admin/dashboard/agent');
        const failRows = (data.recent_failures || []).map(item => '<tr><td>' + new Date(item.time).toLocaleString() + '</td><td>' + item.model + '</td><td>' + item.request_id + '</td><td>' + item.error_type + '</td><td>' + item.http_status + '</td><td>' + item.latency_ms.toFixed(1) + '</td><td>' + item.retries + '</td></tr>').join('');
        content.innerHTML = '<h3 style="margin-top:0">Agent ????</h3>' +
          '<div class="metric-grid">' +
          metricCard('?? Agent ????', data.calls_today) +
          metricCard('?? Agent ???', data.current_requests) +
          metricCard('?????', (data.success_rate * 100).toFixed(2) + '%') +
          metricCard('?????', (data.failure_rate * 100).toFixed(2) + '%') +
          metricCard('??????(ms)', data.average_response_ms.toFixed(2)) +
          metricCard('P95 ????(ms)', data.p95_response_ms.toFixed(2)) +
          metricCard('?? Token ???', data.total_tokens) +
          metricCard('?? Token', data.input_tokens) +
          metricCard('?? Token', data.output_tokens) +
          metricCard('?????? Token', data.average_tokens_per_call.toFixed(2)) +
          metricCard('Tool Calling ??', data.tool_calls) +
          metricCard('Tool Calling ???', (data.tool_success_rate * 100).toFixed(2) + '%') +
          metricCard('RAG ????', data.rag_calls) +
          metricCard('???? Tool ????', data.time_tool_calls) +
          metricCard('??????????', data.moderation_calls) +
          metricCard('Embedding ????', data.embedding_calls) +
          metricCard('Embedding ????', data.embedding_failures) +
          '</div>' +
          '<h3>???? Top Failure</h3><table class="admin-table"><thead><tr><th>??</th><th>??</th><th>Request ID</th><th>????</th><th>HTTP Status</th><th>??(ms)</th><th>????</th></tr></thead><tbody>' + failRows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function loadMessageTraffic() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">??????????...</div>';
      try {
        const data = await request('/admin/dashboard/message-traffic');
        const hourRows = (data.hourly || []).map(item => '<tr><td>' + item.time + '</td><td>' + item.count + '</td></tr>').join('');
        const dayRows = (data.daily || []).map(item => '<tr><td>' + item.time + '</td><td>' + item.count + '</td></tr>').join('');
        const roomRows = (data.top_rooms || []).map(item => '<tr><td>' + item.key + '</td><td>' + item.count + '</td></tr>').join('');
        const userRows = (data.top_users || []).map(item => '<tr><td>' + item.key + '</td><td>' + item.count + '</td></tr>').join('');
        const typeRows = Object.entries(data.type_distribution || {}).map(([k, v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('');
        content.innerHTML = '<h3 style="margin-top:0">??????</h3>' +
          '<div class="metric-grid">' +
          metricCard('??????', data.private_group.private) +
          metricCard('??????', data.private_group.group) +
          metricCard('??????', data.peak_hour || '-') +
          '</div>' +
          '<h3>??????</h3><table class="admin-table"><thead><tr><th>??</th><th>????</th></tr></thead><tbody>' + typeRows + '</tbody></table>' +
          '<h3>?? 24 ????</h3><table class="admin-table"><thead><tr><th>??</th><th>??</th></tr></thead><tbody>' + hourRows + '</tbody></table>' +
          '<h3>?? 7 ???</h3><table class="admin-table"><thead><tr><th>??</th><th>??</th></tr></thead><tbody>' + dayRows + '</tbody></table>' +
          '<h3>???????? Top 10</h3><table class="admin-table"><thead><tr><th>Room ID</th><th>???</th></tr></thead><tbody>' + roomRows + '</tbody></table>' +
          '<h3>???? Top 10</h3><table class="admin-table"><thead><tr><th>User ID</th><th>???</th></tr></thead><tbody>' + userRows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function loadRuntime() {
      const content = document.getElementById('content');
      try {
        const data = await request('/admin/dashboard/runtime');
        const ws = data.websocket;
        const go = data.golang;
        const api = data.api;
        const html = '<h3 style="margin:22px 0 12px">??????</h3>' +
          '<div class="metric-grid">' +
          metricCard('?????', ws.current_connections) +
          metricCard('?????', ws.established_total) +
          metricCard('?????', ws.closed_total) +
          metricCard('???????', ws.abnormal_closed_total) +
          metricCard('????????(ms)', Math.round(ws.average_connection_duration_ms)) +
          metricCard('????????', ws.read_messages_per_minute) +
          metricCard('????????', ws.write_messages_per_minute) +
          metricCard('???????', ws.send_queue_backlog) +
          metricCard('??????', ws.slow_clients) +
          metricCard('Goroutine ??', go.goroutines) +
          metricCard('GOMAXPROCS', go.gomaxprocs) +
          metricCard('Heap Alloc', go.heap_alloc) +
          metricCard('Heap Sys', go.heap_sys) +
          metricCard('GC ??', go.gc_count) +
          metricCard('?? GC ??', go.last_gc_unix ? new Date(go.last_gc_unix * 1000).toLocaleString() : '-') +
          metricCard('GC Pause(ns)', go.gc_pause_ns) +
          metricCard('??????(s)', Math.round(go.uptime_seconds)) +
          metricCard('?? 1 ?? QPS', api.qps_1m.toFixed(2)) +
          metricCard('?? 5 ?? QPS', api.qps_5m.toFixed(2)) +
          metricCard('API ??????(ms)', api.average_latency_ms.toFixed(2)) +
          metricCard('P50 ??(ms)', api.p50_latency_ms.toFixed(2)) +
          metricCard('P95 ??(ms)', api.p95_latency_ms.toFixed(2)) +
          metricCard('P99 ??(ms)', api.p99_latency_ms.toFixed(2)) +
          metricCard('4xx ??', api.status_4xx) +
          metricCard('5xx ??', api.status_5xx) +
          metricCard('???', (api.error_rate * 100).toFixed(2) + '%') +
          '</div>';
        content.insertAdjacentHTML('beforeend', html);
      } catch (error) {
        content.insertAdjacentHTML('beforeend', '<div class="error">?????????' + error.message + '</div>');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.textContent = '';
      btn.disabled = true;
      try {
        await login(
          document.getElementById('username').value.trim(),
          document.getElementById('password').value
        );
      } catch (error) {
        err.textContent = error.message;
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearSession();
      showLogin();
    });

    document.querySelectorAll('aside a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectPage(a.dataset.page);
      });
    });

    if (getToken()) {
      const user = JSON.parse(localStorage.getItem(userKey) || 'null');
      const role = Number(user && user.role);
      if (role >= 1) {
        showShell();
        selectPage('dashboard');
      } else {
        clearSession();
        showLogin();
      }
    } else {
      showLogin();
    }
  </script>
</body>
</html>
