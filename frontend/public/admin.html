<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAN-IM ???????</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif; background: #f4f6fb; color: #1f2937; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 360px; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 12px 30px rgba(15,23,42,.08); }
    h1 { font-size: 20px; margin: 0 0 18px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #475569; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #dc2626; font-size: 13px; min-height: 20px; margin-top: 8px; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    aside { background: #111827; color: #e5e7eb; padding: 18px 12px; }
    aside h1 { color: #fff; font-size: 16px; padding: 0 8px 14px; }

    aside a.active, aside a:hover { background: #1f2937; color: #fff; }
    main { padding: 24px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .placeholder { background: #fff; border-radius: 12px; padding: 32px; color: #64748b; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .metric-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 8px 20px rgba(15,23,42,.05); }
    .metric-value { font-size: 28px; font-weight: 700; color: #111827; }
    .metric-label { margin-top: 6px; color: #64748b; font-size: 13px; }
    .loading { color: #64748b; }
    .admin-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; margin: 10px 0 22px; }
    .admin-table th, .admin-table td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .admin-table th { background: #f8fafc; color: #475569; }
  </style>
</head>

  <script>
    const API_BASE = '/api/v1';
    const tokenKey = 'lan_im_admin_token';
    const userKey = 'lan_im_admin_user';
    const pageTitles = {
      dashboard: 'Dashboard',
      'message-traffic': '????',
      agent: 'Agent监控',
      'agent-config': 'Agent配置',
      'tool-calls': 'Tool Calling 运行记录',
      errors: '系统错误中心',
      rag: 'RAG/Qdrant',
      moderation: '????',
      users: '????',
      rooms: '????',
      connections: '????',
      files: '????',
      'audit-logs': '????'
    };

    function getToken() { return localStorage.getItem(tokenKey); }
    function setSession(token, user) {
      localStorage.setItem(tokenKey, token);
      localStorage.setItem(userKey, JSON.stringify(user || null));
    }
    function clearSession() {
      localStorage.removeItem(tokenKey);
      localStorage.removeItem(userKey);
    }

    function showLogin() {
      document.getElementById('login').style.display = 'flex';
      document.getElementById('shell').style.display = 'none';
    }
    function showShell() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('shell').style.display = 'grid';
    }

    async function login(username, password) {
      const res = await fetch(API_BASE + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.msg || '????');
      const role = Number(data.user && data.user.role);
      if (role < 1) throw new Error('???????????????');
      setSession(data.token, data.user);
      showShell();
      selectPage('dashboard');
    }

    function selectPage(page) {
      document.querySelectorAll('aside a').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
      document.getElementById('pageTitle').textContent = pageTitles[page] || page;
      if (page === 'dashboard') {
        loadDashboard();
      } else if (page === 'message-traffic') {
        loadMessageTraffic();
      } else if (page === 'agent') {
        loadAgentDashboard();
      } else if (page === 'rag') {
        loadRAGDashboard();
      } else if (page === 'moderation') {
        loadModerationDashboard();
      } else if (page === 'users') {
        loadUsers();
      } else if (page === 'rooms') {
        loadRooms();
      } else if (page === 'connections') {
        loadConnections();
      } else if (page === 'files') {
        loadFiles();
      } else if (page === 'agent-config') {
        loadAgentConfigPage();
      } else if (page === 'tool-calls') {
        loadToolCalls();
      } else if (page === 'errors') {
        loadErrors();
      } else {
        document.getElementById('content').textContent = '?????' + (pageTitles[page] || page) + '???????? /api/v1/admin/*?';
      }
    }

    async function request(endpoint, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      const token = getToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(API_BASE + endpoint, Object.assign({}, options, { headers }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.msg || '请求失败');
      return data;
    }

    function metricCard(label, value) {
      return '<div class="metric-card"><div class="metric-value">' + value + '</div><div class="metric-label">' + label + '</div></div>';
    }

      content.innerHTML = '<div class="loading">???? Dashboard...</div>';
      try {
        const data = await request('/admin/dashboard/overview');
        const u = data.sections.users;
        const r = data.sections.rooms;
        const m = data.sections.messages;
        const rt = data.sections.realtime;
        content.innerHTML = '<div class="metric-grid">' +
          metricCard('???????', u.total) +
          metricCard('??????', u.new_today) +
          metricCard('7 ?????', u.new_last_7_days) +
          metricCard('30 ?????', u.new_last_30_days) +
          metricCard('???????', u.online) +
          metricCard('?? WebSocket ???', rt.websocket_connections) +
          metricCard('?????? DAU', u.active_today) +
          metricCard('7 ????? WAU', u.active_last_7_days) +
          metricCard('30 ????? MAU', u.active_last_30_days) +
          metricCard('??????', r.total) +
          metricCard('??????', r.new_today) +
          metricCard('????????', m.today) +
          metricCard('????????', m.private_today) +
          metricCard('????????', m.group_today) +
          metricCard('????????', m.file_today) +
          metricCard('?? @Agent ????', m.agent_today) +
          '</div>';
        loadRuntime();
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function loadConnections() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">????????...</div>';
      try {
        const data = await request('/admin/connections');
        const rows = (data.items || []).map(item => '<tr><td>' + item.user_id + '</td><td>' + item.username + '</td><td>' + item.connection_id + '</td><td>' + item.remote_ip + '</td><td>' + new Date(item.connected_at).toLocaleString() + '</td><td>' + Math.round((Date.now() - new Date(item.connected_at).getTime()) / 1000) + 's</td><td>' + new Date(item.last_read_at).toLocaleString() + '</td><td>' + new Date(item.last_write_at).toLocaleString() + '</td><td>' + item.send_queue_len + '</td><td>' + (item.room_ids || []).join(',') + '</td><td>' +
          '<button onclick="connectionClose(\'' + item.connection_id + '\')">????</button> ' +
          '<button onclick="connectionForceOffline(' + item.user_id + ')">????</button>' +
          '</td></tr>').join('');

      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';

        alert('?????');

      if (!confirm('???????? ' + userId + ' ??')) return;

    window.connectionClose = connectionClose;
    window.connectionForceOffline = connectionForceOffline;

    async function loadErrors() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">\u6b63\u5728\u52a0\u8f7d\u7cfb\u7edf\u9519\u8bef...</div>';
      try {
        const module = document.getElementById('errorModule') ? document.getElementById('errorModule').value : '';
        const errorType = document.getElementById('errorType') ? document.getElementById('errorType').value : '';
        const resolved = document.getElementById('errorResolved') ? document.getElementById('errorResolved').value : '';
        const params = new URLSearchParams({ page: 1, page_size: 50 });
        if (module) params.set('module', module);
        if (errorType) params.set('error_type', errorType);
        if (resolved) params.set('resolved', resolved);
        const data = await request('/admin/errors?' + params.toString());
        const rows = (data.items || []).map(item => '<tr><td>' + item.id + '</td><td>' + new Date(item.timestamp).toLocaleString() + '</td><td>' + item.module + '</td><td>' + item.error_type + '</td><td>' + item.error_message + '</td><td>' + item.request_id + '</td><td>' + item.user_id + '</td><td>' + item.room_id + '</td><td>' + (item.resolved ? '\u5df2\u5904\u7406' : '\u672a\u5904\u7406') + '</td><td><button onclick="resolveError(' + item.id + ')">\u6807\u8bb0\u5df2\u5904\u7406</button></td></tr>').join('');
        content.innerHTML = '<div class="toolbar"><input id="errorModule" placeholder="\u6a21\u5757"><input id="errorType" placeholder="\u9519\u8bef\u7c7b\u578b"><select id="errorResolved"><option value="">\u5168\u90e8</option><option value="false">\u672a\u5904\u7406</option><option value="true">\u5df2\u5904\u7406</option></select><button onclick="loadErrors()">\u67e5\u8be2</button></div>' +
          '<h3 style="margin-top:14px">\u7cfb\u7edf\u9519\u8bef\u4e2d\u5fc3</h3><table class="admin-table"><thead><tr><th>ID</th><th>\u65f6\u95f4</th><th>\u6a21\u5757</th><th>\u9519\u8bef\u7c7b\u578b</th><th>\u9519\u8bef\u4fe1\u606f</th><th>Request ID</th><th>\u7528\u6237ID</th><th>\u7fa4\u804aID</th><th>\u72b6\u6001</th><th>\u64cd\u4f5c</th></tr></thead><tbody>' + rows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    async function resolveError(id) {
      try {
        await request('/admin/errors/' + id + '/resolve', { method: 'POST' });
        alert('\u5df2\u6807\u8bb0\u4e3a\u5df2\u5904\u7406');
        loadErrors();

        alert(error.message);
      }

    window.loadErrors = loadErrors;
    window.resolveError = resolveError;

    async function loadToolCalls() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">\u6b63\u5728\u52a0\u8f7d Tool Calling \u8bb0\u5f55...</div>';
      try {
        const toolName = document.getElementById('toolCallToolName') ? document.getElementById('toolCallToolName').value : '';
        const userId = document.getElementById('toolCallUserId') ? document.getElementById('toolCallUserId').value : '';
        const roomId = document.getElementById('toolCallRoomId') ? document.getElementById('toolCallRoomId').value : '';
        const success = document.getElementById('toolCallSuccess') ? document.getElementById('toolCallSuccess').value : '';

        if (userId) params.set('user_id', userId);
        if (roomId) params.set('room_id', roomId);

        const data = await request('/admin/tool-calls?' + params.toString());
        const rows = (data.items || []).map(item => '<tr><td>' + item.id + '</td><td>' + item.tool_call_id + '</td><td>' + item.agent_request_id + '</td><td>' + item.user_id + ' (' + item.username + ')</td><td>' + item.room_id + ' (' + item.room_name + ')</td><td>' + item.tool_name + '</td><td>' + item.arguments + '</td><td>' + new Date(item.started_at).toLocaleString() + '</td><td>' + new Date(item.finished_at).toLocaleString() + '</td><td>' + item.latency_ms.toFixed(2) + '</td><td>' + (item.success ? '\u6210\u529f' : '\u5931\u8d25') + '</td><td>' + (item.error || '') + '</td></tr>').join('');
        content.innerHTML = '<div class="toolbar"><input id="toolCallToolName" placeholder="Tool\u540d\u79f0"><input id="toolCallUserId" placeholder="\u7528\u6237ID"><input id="toolCallRoomId" placeholder="\u7fa4\u804aID"><select id="toolCallSuccess"><option value="">\u5168\u90e8</option><option value="true">\u6210\u529f</option><option value="false">\u5931\u8d25</option></select><button onclick="loadToolCalls()">\u67e5\u8be2</button></div>' +
          '<h3 style="margin-top:14px">Tool Calling \u8fd0\u884c\u8bb0\u5f55</h3><table class="admin-table"><thead><tr><th>ID</th><th>Tool Call ID</th><th>Agent Request ID</th><th>\u7528\u6237</th><th>\u7fa4\u804a</th><th>\u5de5\u5177\u540d\u79f0</th><th>\u53c2\u6570</th><th>\u5f00\u59cb\u65f6\u95f4</th><th>\u7ed3\u675f\u65f6\u95f4</th><th>\u8017\u65f6(ms)</th><th>\u7ed3\u679c</th><th>\u9519\u8bef</th></tr></thead><tbody>' + rows + '</tbody></table>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }

    window.loadToolCalls = loadToolCalls;

    async function loadAgentConfigPage() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">\u6b63\u5728\u52a0\u8f7d Agent \u914d\u7f6e...</div>';
      try {
        const cfg = await request('/admin/agent-config');
        content.innerHTML = '<h3 style="margin-top:0">\u5168\u5c40 Agent \u914d\u7f6e</h3>' +
          '<div class="toolbar"><button onclick="agentConfigSave()">\u4fdd\u5b58\u914d\u7f6e</button> <button onclick="agentConfigRollback()">\u56de\u6eda\u4e0a\u4e00\u7248\u672c</button> <button onclick="agentConfigHistory()">\u5386\u53f2\u8bb0\u5f55</button></div>' +
          '<div class="form-grid">' +
          agentField('global_enabled', '\u5168\u5c40\u542f\u7528', 'checkbox', cfg.global_enabled) +
          agentField('default_model', '\u9ed8\u8ba4\u6a21\u578b', 'text', cfg.default_model) +
          agentField('embedding_model', 'Embedding \u6a21\u578b', 'text', cfg.embedding_model) +
          agentField('temperature', 'Temperature', 'number', cfg.temperature) +
          agentField('max_tokens', 'Max Tokens', 'number', cfg.max_tokens) +
          agentField('rag_top_k', 'RAG Top-K', 'number', cfg.rag_top_k) +
          agentField('rag_similarity_threshold', 'RAG \u76f8\u4f3c\u5ea6\u9608\u503c', 'number', cfg.rag_similarity_threshold) +
          agentField('chunk_size', 'Chunk Size', 'number', cfg.chunk_size) +
          agentField('chunk_overlap', 'Chunk Overlap', 'number', cfg.chunk_overlap) +
          agentField('moderation_enabled', '\u5185\u5bb9\u5ba1\u6838\u542f\u7528', 'checkbox', cfg.moderation_enabled) +
          agentField('moderation_model', '\u5ba1\u6838\u6a21\u578b', 'text', cfg.moderation_model) +
          agentField('moderation_threshold', '\u5ba1\u6838\u9608\u503c', 'number', cfg.moderation_threshold) +
          agentField('tool_calling_enabled', 'Tool Calling \u542f\u7528', 'checkbox', cfg.tool_calling_enabled) +
          agentField('auto_kick_enabled', '\u81ea\u52a8\u8e22\u4eba\u542f\u7528', 'checkbox', cfg.auto_kick_enabled) +
          agentField('auto_ban_enabled', '\u81ea\u52a8\u5c01\u7981\u542f\u7528', 'checkbox', cfg.auto_ban_enabled) +
          agentArea('system_prompt', 'System Prompt', cfg.system_prompt) +
          agentArea('moderation_prompt', 'Moderation Prompt', cfg.moderation_prompt) +
          agentArea('rag_prompt', 'RAG Prompt', cfg.rag_prompt) +
          agentArea('tool_calling_prompt', 'Tool Calling Prompt', cfg.tool_calling_prompt) +
          '</div>';
      } catch (error) {
        content.innerHTML = '<div class="error">' + error.message + '</div>';
      }
    }

    function agentField(name, label, type, value) {
      const id = 'cfg_' + name;
      const checked = value ? 'checked' : '';
      const input = type === 'checkbox'
        ? '<input id="' + id + '" type="checkbox" ' + checked + '>'
        : '<input id="' + id + '" type="' + type + '" value="' + (value || '') + '">';
      return '<label>' + label + '</label>' + input;
    }

    function agentArea(name, label, value) {
      return '<label>' + label + '</label><textarea id="cfg_' + name + '" rows="5">' + (value || '') + '</textarea>';
    }

    function readAgentConfigInputs() {
      const names = [
        'global_enabled', 'default_model', 'embedding_model', 'temperature', 'max_tokens',
        'rag_top_k', 'rag_similarity_threshold', 'chunk_size', 'chunk_overlap',
        'moderation_enabled', 'moderation_model', 'moderation_threshold',
        'tool_calling_enabled', 'auto_kick_enabled', 'auto_ban_enabled',
        'system_prompt', 'moderation_prompt', 'rag_prompt', 'tool_calling_prompt'
      ];
      const body = {};
      names.forEach(name => {
        const el = document.getElementById('cfg_' + name);
        if (!el) return;
        if (el.type === 'checkbox') {
          body[name] = el.checked;
        } else if (el.type === 'number') {
          body[name] = Number(el.value);
        } else {
          body[name] = el.value;
        }
      });
      return body;
    }

    async function agentConfigSave() {
      try {
        await request('/admin/agent-config', { method: 'PUT', body: JSON.stringify(readAgentConfigInputs()) });
        alert('\u914d\u7f6e\u5df2\u4fdd\u5b58');
        loadAgentConfigPage();
      } catch (error) {
        alert(error.message);
      }
    }

      if (!confirm('\u786e\u8ba4\u56de\u6eda\u5230\u4e0a\u4e00\u7248\u672c\u5417\uff1f')) return;
      try {
        await request('/admin/agent-config/rollback', { method: 'POST' });
        alert('\u56de\u6eda\u6210\u529f');
        loadAgentConfigPage();
      } catch (error) {
        alert(error.message);
      }

        const data = await request('/admin/agent-config/history?page=1&page_size=20');

        const html = '<h3>\u914d\u7f6e\u5386\u53f2</h3><table class="admin-table"><thead><tr><th>\u7248\u672c</th><th>\u7ba1\u7406\u5458</th><th>\u65f6\u95f4</th><th>\u64cd\u4f5c</th></tr></thead><tbody>' + rows + '</tbody></table>';
        const content = document.getElementById('content');
        content.innerHTML = html;
      } catch (error) {
        alert(error.message);
      }
    }

    function agentConfigHistoryDetail(before, after) {
      alert('\u4fee\u6539\u524d\uff1a' + before + '\n\n\u4fee\u6539\u540e\uff1a' + after);
    }

    window.agentConfigSave = agentConfigSave;
    window.agentConfigRollback = agentConfigRollback;
    window.agentConfigHistory = agentConfigHistory;
    window.agentConfigHistoryDetail = agentConfigHistoryDetail;

    function buildFileQuery() {
      const params = new URLSearchParams({ page: 1, page_size: 50 });
      const keyword = document.getElementById('fileKeyword') ? document.getElementById('fileKeyword').value : '';
